name: Kurzusoldal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - uses: quarto-dev/quarto-actions/render@v2
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Amíg az oldal nem nyilvános, csak kézzel indítva telepít ki (Actions → Kurzusoldal → Run workflow).
  # Élesítéskor ez a feltétel törölhető, és minden push kitelepít.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
